<!doctype html>
<html lang="es-CR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Staff · Iniciar sesión</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="marca">
    <h1>Panel del staff</h1>
    <p>Sume sellos y canjee premios</p>
  </header>
  <main class="contenedor">
    <form id="formulario" class="tarjeta" novalidate>
      <div class="campo">
        <label for="negocio">Negocio</label>
        <input id="negocio" type="text" autocapitalize="none" autocomplete="organization" placeholder="ej. podosport" required>
      </div>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" autocapitalize="none" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="error" class="mensaje error" hidden></div>
      <button class="boton bloque" id="enviar" type="submit">Entrar</button>
    </form>
  </main>
  <script src="/js/comun.js"></script>
  <script src="/js/staff-login.js"></script>
</body>
</html>
